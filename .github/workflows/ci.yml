name: CI

# Quand est-ce que ce workflow se lance ?
# - Sur chaque push sur main (après un merge)
# - Sur chaque pull request (avant de merger)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1 : Vérification du style et de la sécurité du code
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Installe Ruby avec la version du fichier .ruby-version
      # bundler-cache: true → met en cache les gems pour accélérer les prochains runs
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Rubocop vérifie le style du code (indentation, conventions Rails, etc.)
      # -f github → format spécial qui affiche les erreurs directement dans la PR
      - name: Lint code style
        run: bin/rubocop -f github

      # Brakeman scanne le code pour les failles de sécurité courantes
      # (SQL injection, XSS, mass assignment, etc.)
      - name: Security scan
        run: bin/brakeman --no-pager

  # Job 2 : Tests RSpec
  # Ce job a besoin d'une base de données et de Redis
  test:
    runs-on: ubuntu-latest

    # Services = conteneurs Docker qui tournent à côté du job
    # C'est comme ton docker-compose.yml mais géré par GitHub Actions
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Healthcheck : le job attend que PostgreSQL soit prêt avant de continuer
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10

    # Variables d'environnement pour le job
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/padelicense_test
      REDIS_URL: redis://localhost:6379/0
      RAILS_ENV: test
      # Fausses clés Stripe — les tests unitaires mockent Stripe,
      # ils n'appellent jamais la vraie API
      STRIPE_SECRET_KEY: sk_test_fake_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_fake_for_ci
      # Secret key for JWT signing — any value works for tests
      SECRET_KEY_BASE: test_secret_key_base_for_ci_at_least_64_characters_long_to_satisfy_rails

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Crée la base de test et charge le schéma
      # db:prepare = db:create + db:schema:load (ou db:migrate si la DB existe déjà)
      - name: Setup database
        run: bin/rails db:prepare

      # Lance tous les tests RSpec
      - name: Run tests
        run: bundle exec rspec

  # Job 3 : Déclencher les E2E du front et attendre le résultat
  # Utilise workflow_dispatch pour pouvoir tracker le run et poll son statut
  # Échoue si les E2E du front échouent
  trigger-e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Trigger and wait for E2E tests
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: padelicense-shop
          github_token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          workflow_file_name: e2e.yml
          ref: main
          client_payload: '{"api_ref": "${{ github.head_ref || github.ref_name }}"}'
          wait_interval: 30
          propagate_failure: true
